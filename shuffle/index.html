<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#152b26" />
<title>Penas pro Ar — Revoada do Caos</title>
<link rel="stylesheet" href="./style.css?v=7ba1abca2cd6" />
</head>
<body>
<main id="app">
  <header class="topbar">
    <a href="../index.html" class="brand" aria-label="Voltar ao Penas pro Ar"><span>PENAS PRO AR</span><strong>Revoada do Caos <small>10 FASES</small></strong></a>
    <div class="topbar-actions"><button id="audioMute" type="button" aria-pressed="false">Ativar som</button><button id="fusionBook" type="button" hidden>Fusões</button><button id="pause" type="button" disabled>Pausar</button></div>
  </header>
  <section id="playfield" aria-label="Fazenda da Revoada do Caos">
    <canvas id="game" tabindex="0" aria-label="Use WASD ou setas para mover, espaço para esquivar, Q para isca e E para interagir."></canvas>
    <div class="hud" aria-live="off"><div><span id="stageLabel">UM NOVO BARALHO</span><strong id="objective">Escolha seus poderes.</strong></div><div class="health"><span id="health">3 / 3 vidas</span><small id="level">Nível 0</small><div id="xpHud" hidden><progress id="xpMeter" value="0" max="8" aria-label="Experiência até o próximo nível"></progress><small id="xpLabel">0 / 8 XP</small></div></div></div>
    <div id="bossHud" hidden><span id="bossName">CHEFE</span><progress id="bossMeter" value="3" max="3" aria-label="Resistência do chefe"></progress></div>
    <p id="notice" role="status" aria-live="polite"></p>
    <aside id="combatQuip" hidden role="status" aria-live="polite" aria-label="Fala do inimigo"></aside>
    <div id="overlay" class="overlay">
      <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"></section>
    </div>
  </section>
  <div id="powerHud" hidden aria-label="Personagem e poderes coletados"></div>
  <footer id="controls">
    <div id="joystick" role="group" aria-label="Arraste para mover a galinha"><span class="cross"></span><span id="knob"></span></div>
    <div class="keyboard-hint"><strong>Resgate. Escolha. Improvise.</strong><span>WASD / setas · mover &nbsp; Espaço · esquiva &nbsp; E · interagir &nbsp; Q · isca</span><small id="buildSummary">Suas habilidades aparecem aqui.</small></div>
    <div class="actions"><button id="dash" type="button">Esquiva <small>Espaço</small></button><button id="corn" type="button" disabled>Isca <small>Bloqueada</small></button><button id="interact" type="button">Interagir <small>E</small></button></div>
  </footer>
</main>
<script>const SpriteData = {}; const PremiumWildlifeData = {};</script>
<script src="../assets/farm/arcade-data.js?v=6fea0143dcc0"></script>
<script src="../systems/sprite-style.js?v=a9710c8c03ca"></script>
<script src="../systems/farm-sprites.js?v=cfb9d00976ef"></script>
<script src="../systems/pixellab-art-data.js?v=b1805bb246de"></script>
<script src="../systems/comfyui-art-data.js?v=979324a9f081"></script>
<script src="./chaos-art-data.js?v=9460c333d74c"></script>
<script src="../systems/character-art.js?v=1fbfa6fe8f19"></script>
<script src="../systems/skin-system.js?v=965734460a27"></script>
<script src="./maps.js?v=c686657fb303"></script>
<script src="./engine.js?v=dbe4520f4f3b"></script>
<script src="./survival.js?v=f8e7e5b85182"></script>
<script src="./result-art.js?v=d40ffff0d675"></script>
<script src="./effects.js?v=6108d661bcef"></script>
<script src="../systems/audio-system.js?v=1a3f53e50ad5"></script>
<script src="./ui.js?v=cf4ce42c8725"></script>
</body>
</html>
