name: Check native Python Shuffle
on:
  push:
    paths: ['python_game/**', '.github/workflows/check-python-shuffle.yml']
  pull_request:
    paths: ['python_game/**', '.github/workflows/check-python-shuffle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r python_game/requirements.txt
      - run: python -m unittest discover -s python_game/tests -v
      - run: python python_game/main.py --smoke --screenshots .cache/python-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-review-${{ matrix.os }}
          path: .cache/python-review/
          retention-days: 7
