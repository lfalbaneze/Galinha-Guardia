name: Validate menu play invitation
on:
  push:
    branches: [fix/menu-play-hint]
    paths:
      - '.github/update-menu-hint.py'
      - '.github/workflows/update-menu-hint.yml'
      - 'tests/menu-play-hint.test.cjs'
      - 'tests/browser/menu_play_hint.py'
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/fix/menu-play-hint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/menu-play-hint
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply only the reviewed title-screen changes
        run: |
          test "$(git hash-object menu.css)" = a992e07e4d6ee28830b461af524c87a224f34eef
          test "$(git hash-object systems/menu-scene.js)" = e5ed6b0b1c7af8a58096e0b35c6b957bb2e8752a
          test "$(git hash-object index.html)" = 9dd0947a425504172665a1370899b673dce4a1fb
          python .github/update-menu-hint.py
          git diff --check
          node --check systems/menu-scene.js
      - run: npm ci
      - name: Verify title interactions and invitation placement
        run: node --test tests/menu-scene.test.cjs tests/menu-play-hint.test.cjs
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check desktop and touch in a real browser
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/menu-hint-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          python tests/browser/menu_play_hint.py
      - name: Commit validated changes and remove preparation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/update-menu-hint.py .github/workflows/update-menu-hint.yml
          git add index.html menu.css systems/menu-scene.js tests/menu-play-hint.test.cjs tests/browser/menu_play_hint.py
          git diff --cached --check
          git commit -m 'ui: aproxima convite de brincar da turma e remove seta confusa'
          git push origin HEAD:fix/menu-play-hint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-play-hint-review
          path: .cache/menu-hint-review/
          retention-days: 3
