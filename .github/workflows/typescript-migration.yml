name: Validate TypeScript migration

on:
  push:
    branches: [refactor/typescript-gameplay]

permissions:
  contents: write

concurrency:
  group: typescript-migration
  cancel-in-progress: false

jobs:
  migration:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/refactor/typescript-gameplay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run compile
      - run: npm run check:generated
      - name: Record compiler outputs on the migration branch
        run: |
          git add systems/detection-system.js systems/game-manager.js systems/hiding-spots.js systems/map-manager.js systems/player.js systems/rescue-system.js systems/wolf-ai.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: atualiza JavaScript compilado dos sistemas de gameplay [skip ci]'
            git push origin HEAD:refs/heads/refactor/typescript-gameplay
          fi
      - name: Run the complete test suite
        run: npm test
      - name: Build the browser distribution
        run: npm run build
