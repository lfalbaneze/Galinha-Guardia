name: Check game

on:
  push:
    branches: [main, refactor/typescript-gameplay]
  pull_request:

permissions:
  contents: read

concurrency:
  group: game-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:generated
      - run: npm test
      - run: npm run build
