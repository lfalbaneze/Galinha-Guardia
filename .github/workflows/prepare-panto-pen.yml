name: Prepare and validate Panto pen update
on:
  push:
    branches: [fix/panto-pen-life]
    paths:
      - '.github/panto-pen.patch.gz'
      - '.github/workflows/prepare-panto-pen.yml'
      - 'src/systems/pen-life.ts'
      - 'tests/pen-life.test.cjs'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/fix/panto-pen-life'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/panto-pen-life
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply reviewed changes to the verified source versions
        run: |
          test "$(git hash-object index.html)" = 172de3d09ab7f55459b4b10ceb6dd90dc1664a6b
          test "$(git hash-object src/systems/goose-system.ts)" = f875589abce3e3af80fa3c28deb77d89871f129e
          test "$(git hash-object src/systems/lake-challenge.ts)" = fe82fab0df98ec7d3bbb5bd4984139875154231b
          test "$(git hash-object tests/stealth-lagoon.test.cjs)" = 2928243394387b5d2ed01e01fac39016a288a5dc
          test "$(git hash-object tests/browser/lake_smoke.py)" = a7cc90974f769ffa787df03d9999de5fd79e3c81
          gzip -dc .github/panto-pen.patch.gz > "$RUNNER_TEMP/panto-pen.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/panto-pen.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/panto-pen.patch"
          git diff --check
      - run: npm ci
      - run: npm run compile
      - run: npm run typecheck
      - run: npm run check:generated
      - name: Verify movement, dialogue, challenge, saves and curral protection
        run: node --test tests/pen-life.test.cjs tests/stealth-lagoon.test.cjs tests/lake-challenge.test.cjs tests/goose.test.cjs tests/refuge-safe-area.test.cjs tests/refuge-sign-grumble.test.cjs
      - run: npm run build
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play Panto challenge and verify walking and removed lake immunity in browser
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/panto-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          python tests/browser/lake_smoke.py
      - name: Commit only validated game changes and remove preparation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/panto-pen.patch.gz .github/workflows/prepare-panto-pen.yml
          git add index.html src/systems/goose-system.ts src/systems/lake-challenge.ts src/systems/pen-life.ts systems/goose-system.js systems/lake-challenge.js systems/pen-life.js tests/pen-life.test.cjs tests/stealth-lagoon.test.cjs tests/browser/lake_smoke.py
          git diff --cached --check
          git commit -m 'fix: remove refúgio da lagoa e dá vida ao curral e ao Panto'
          git push origin HEAD:fix/panto-pen-life
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panto-pen-browser-review
          path: .cache/lake-review/
          retention-days: 3
