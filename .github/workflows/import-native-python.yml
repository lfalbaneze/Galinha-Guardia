name: Validate and commit native Python package
on:
  push:
    branches: [feat/python-shuffle]
    paths:
      - '.github/python-import-*'
      - '.github/workflows/import-native-python.yml'
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/feat/python-shuffle'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/python-shuffle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Import the reviewed package with exact content verification
        run: |
          test ! -e python_game
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, hashlib, json
          parts = [
            ('.github/python-import-1.bin', '0c48e7f205423f487d256d38922ef05fb3101921', ('S8pcYpdKF7p', 'S8YpdKF7p')),
            ('.github/python-import-2.bin', 'fbadc0427efce66ce37be3268b0a7c76c6343e25', ('WCuGQxHcvU', 'WCuQxHcvU')),
            ('.github/python-import-3.gz', 'bb719ca5f777140cf89037b5c2037c5aff430fe7', None),
          ]
          allowed = {'art.py','main.py','engine.py','world.py','.gitignore','Jogar.bat','README.md','VALIDACAO.md','jogar.sh','requirements.txt','tests/test_engine.py','tests/test_ui.py','tools/check-python-shuffle.yml','tools/export_assets.cjs'}
          files = {}
          for filename, expected, repair in parts:
            payload = Path(filename).read_bytes()
            if repair:
              # Correct two verified transfer typos; the original blob hash is mandatory.
              encoded = base64.b64encode(payload).decode().rstrip('=')
              assert encoded.count(repair[0]) == 1
              encoded = encoded.replace(*repair)
              payload = base64.b64decode(encoded + '=' * (-len(encoded) % 4), validate=True)
            actual = hashlib.sha1(b'blob ' + str(len(payload)).encode() + b'\0' + payload).hexdigest()
            assert actual == expected, (filename, actual)
            group = json.loads(gzip.decompress(payload))
            assert isinstance(group, dict) and not (files.keys() & group.keys())
            files.update(group)
          assert set(files) == {'python_game/' + p for p in allowed}
          for name, text in files.items():
            path = PurePosixPath(name)
            assert not path.is_absolute() and '..' not in path.parts and isinstance(text, str)
            dest = Path(name)
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_text(text, encoding='utf-8', newline='')
          print('Verified and imported', len(files), 'source files from the delivered Python package.')
          PY
          node python_game/tools/export_assets.cjs
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'scenery.json':'405abcef9e7126e3718983346718dc714adc771217e284a5225b36b911d3e8b8',
            'scenery.png':'9cede2e59503e4c95eab9406d49cf1aa95bd79a11539779659d1a79968a178e0',
            'characters.json':'ee4b104aef57587c66e941868c2aab241c6d904bd1a71cc30c057f236c6c65f2',
          }
          for name, digest in expected.items():
            actual = hashlib.sha256((Path('python_game/assets') / name).read_bytes()).hexdigest()
            assert actual == digest, (name, actual)
          print('All exported assets match the delivered package byte for byte.')
          PY
          git diff --check
      - name: Install the pinned Python runtime dependency
        run: python -m pip install -r python_game/requirements.txt
      - name: Verify campaign, checkpoints, keyboard and SDL rendering
        run: python -m unittest discover -s python_game/tests -v
      - name: Run the packaged native game smoke test
        run: python python_game/main.py --smoke --screenshots .cache/python-commit-review
      - name: Commit verified Python files on the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/python-import-1.bin .github/python-import-2.bin .github/python-import-3.gz .github/workflows/import-native-python.yml
          git add python_game
          git diff --cached --check
          git commit -m 'feat: adiciona pacote nativo Python com mapas, habilidades e chefes'
          git push origin HEAD:refs/heads/feat/python-shuffle
          echo "PYTHON_TREE=$(git rev-parse HEAD:python_game)"
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
