name: Finish lake feedback
on:
  push:
    branches: [feature/lake-challenge-polish]
    paths: [.github/workflows/lake-final-polish.yml]
permissions:
  contents: read
jobs:
  polish:
    if: github.ref == 'refs/heads/feature/lake-challenge-polish'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Align challenge feedback and add regressions
        shell: python
        run: |
          from pathlib import Path
          p=Path('systems/interface-motion.js');s=p.read_text()
          old="    if (!playing) { level = 'calm'; label = game.phase === 'menu' ? 'A fazenda está em pausa' : 'Fim da aventura'; amount = 0; }"
          assert s.count(old)==1
          p.write_text(s.replace(old,"    if (game.lake?.active) { level = 'safe'; label = 'O lobo espera fora do lago'; amount = 0; }\n"+old))
          p=Path('src/systems/goose-system.ts');s=p.read_text()
          old="    const p = worldToScreen(goose);\n    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) return;"
          assert s.count(old)==1
          p.write_text(s.replace(old,"    if (goose.mode === 'defeated' && (game.skinNotice?.time || 0) > 0) return;\n"+old))
          Path('tests/lake-feedback.test.cjs').write_text('''const test = require('node:test');
          const assert = require('node:assert/strict');
          const { createGame } = require('./helpers.cjs');

          test('the visible threat card explains that the wolf waits outside the active lake challenge', () => {
            const h = createGame(() => .5);
            h.run('state.lake.active=true;GameUI.update(state)');
            assert.equal(h.elements.get('threatText').textContent, 'O lobo espera fora do lago');
            assert.equal(h.elements.get('threatProgress').value, 0);
            h.run('state.lake.active=false;GameUI.update(state)');
            assert.notEqual(h.elements.get('threatText').textContent, 'O lobo espera fora do lago');
          });

          test('the defeated goose does not talk over the cosmetic unlock notice', () => {
            const h = createGame(() => .5);
            h.run(`var spoken=[];ctx.fillText=text=>spoken.push(text);
              var g=state.entities.goose,c=state.entities.chicken;
              OBSTACLES=[];g.x=1000;g.y=800;g.mode='defeated';c.x=1030;c.y=800;
              camera.x=700;camera.y=600;state.skinNotice={time:3,text:'Ganso do lago'};
              GooseSystem.drawIndicator(state);`);
            assert.equal(h.run("spoken.includes('Pode passar…')"), false);
            h.run('state.skinNotice.time=0;GooseSystem.drawIndicator(state)');
            assert.equal(h.run("spoken.includes('Pode passar…')"), true);
          });
          ''')
      - run: npm ci
      - run: npm run verify
      - run: npm run check:generated
      - name: Record tested feedback fixes
        run: |
          git add src/systems/goose-system.ts systems/goose-system.js systems/interface-motion.js tests/lake-feedback.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sincroniza aviso do lobo e evita sobreposição na recompensa'
          git push origin HEAD:refs/heads/feature/lake-challenge-polish
