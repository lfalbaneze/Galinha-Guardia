name: Lake workspace
on:
  push:
    branches: [feature/lake-challenge-polish]
    paths: [.github/workflows/lake-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Package source and development dependencies
        run: tar --exclude=.git --exclude=dist -czf /tmp/lake-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lake-workspace
          path: /tmp/lake-workspace.tar.gz
          retention-days: 1
