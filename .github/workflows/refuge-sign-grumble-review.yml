name: Refuge sign and grumble review
on:
  push:
    branches: [review/refuge-sign-grumble]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:generated
      - run: node --test tests/refuge-sign-grumble.test.cjs tests/refuge-safe-area.test.cjs tests/wolf-dialogue.test.cjs tests/refuge.test.cjs
