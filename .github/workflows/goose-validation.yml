name: Validate territorial goose

on:
  push:
    branches: [feature/territorial-goose]
    paths: [.goose-payload/**, .goose-apply.cjs, .github/workflows/goose-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/feature/territorial-goose'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply verified source changes
        run: node .goose-apply.cjs
      - run: npm ci
      - run: node scripts/generate-goose-audio.cjs
      - name: Types, complete tests and browser build
        run: npm run verify
      - run: npm run check:generated
      - name: Prepare browser smoke test
        run: |
          python3 -m venv /tmp/goose-browser-env
          /tmp/goose-browser-env/bin/pip install playwright==1.57.0
          /tmp/goose-browser-env/bin/python -m playwright install --with-deps chromium
      - name: Check playing, goose dash, saved progress, pause and offline startup
        run: /tmp/goose-browser-env/bin/python .goose-browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goose-visual-review
          path: /tmp/goose-review
          if-no-files-found: ignore
          retention-days: 7
      - name: Record validated feature and remove temporary development files
        run: |
          rm -rf .goose-payload .goose-apply.cjs .goose-browser-check.py
          rm .github/workflows/goose-workspace.yml .github/workflows/goose-validation.yml
          git add README.md .gitattributes game.js index.html docs/typescript.md src/types src/systems systems scripts/generate-audio.cjs scripts/generate-goose-audio.cjs tests assets/audio/CREDITS.html assets/audio/goose-honk.wav assets/sprites/CREDITS.html
          git add -u -- .goose-payload .goose-apply.cjs .github/workflows/goose-workspace.yml .github/workflows/goose-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: adiciona ganso territorial com aviso e investida'
          git push origin HEAD:refs/heads/feature/territorial-goose
