name: Refuge safe area review v2
on:
  push:
    branches: [review/refuge-safe-area-v2]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:generated
      - run: node --test tests/refuge-safe-area.test.cjs tests/refuge.test.cjs tests/navigation-cover-regression.test.cjs tests/witnessed-hiding.test.cjs tests/gameplay-polish.test.cjs
