name: Validate approved sprites and Panto
on:
  push:
    branches: [art/approved-wildlife-panto]
    paths: [.github/workflows/panto-integrate.yml, '.panto-data/**']
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/art/approved-wildlife-panto'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply verified artwork and source patch
        run: |
          cat .panto-data/source-* > /tmp/panto-source.xz
          echo '45a23a61cb8b1290f95978d60a083034ddec96de9ae8a38da66df4ece002a116  /tmp/panto-source.xz' | sha256sum -c -
          python -c "import lzma,pathlib; pathlib.Path('/tmp/panto-source.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/panto-source.xz').read_bytes()))"
          git apply --check /tmp/panto-source.patch
          git apply /tmp/panto-source.patch
          cat .panto-data/fox-* > assets/sprites/sources/fox.png
          cat .panto-data/owl-* > assets/sprites/sources/owl.png
          echo '7358e4be0d0f03edc029d7baac690232cd22de179b4437a51f2490e95e25e272  assets/sprites/sources/fox.png' | sha256sum -c -
          echo '1a34d23f75cd22ea34eb183fa10537e4f8085da6e74488733975cc0308eaeba5  assets/sprites/sources/owl.png' | sha256sum -c -
      - run: npm ci
      - run: npm run verify
      - run: npm run check:generated
      - name: Record validated source and sprites
        run: |
          rm -rf .panto-data
          git add -A -- . ':!.github'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art: integra sprites aprovados e apresenta Panto'
          git push origin HEAD:refs/heads/art/approved-wildlife-panto
