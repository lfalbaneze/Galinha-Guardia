name: Finalize validated ten-stage Shuffle campaign
on:
  push:
    branches: [feat/shuffle-procedural-10]
    paths:
      - '.github/shuffle10-parts/**'
      - '.github/workflows/prepare-shuffle-procedural.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/feat/shuffle-procedural-10'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shuffle-procedural-10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply the exact patch whose build and browser checks passed in run 36612436114
        run: |
          cat .github/shuffle10-parts/* | gzip -dc > "$RUNNER_TEMP/shuffle10.patch"
          echo "13ee117b7dec776df209e2ead921335ead2815c1bd5c97500c4438fa4c6c2aca  $RUNNER_TEMP/shuffle10.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/shuffle10.patch"
          git apply "$RUNNER_TEMP/shuffle10.patch"
          # The bot lacks permission to create new workflows. Omit this optional
          # CI addition; keep the validated game, documentation and test files.
          rm .github/workflows/check-shuffle.yml
          git diff --check
          node --check shuffle/maps.js
          node --check shuffle/engine.js
          node --check shuffle/ui.js
          python3 -m py_compile tests/browser/shuffle_smoke.py
      - run: npm ci
      - run: npm run typecheck && npm run check:generated
      - name: Recheck seeded generation, campaign, cards and menu before publishing
        run: node --test tests/shuffle-run.test.cjs tests/menu-scene.test.cjs tests/menu-play-hint.test.cjs
      - name: Commit game changes without adding any workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/shuffle10-parts .github/workflows/prepare-shuffle-procedural.yml
          git add docs/shuffle-prototype.md scripts/build.cjs shuffle/engine.js shuffle/maps.js shuffle/index.html shuffle/style.css shuffle/ui.js tests/browser/shuffle_smoke.py tests/shuffle-run.test.cjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat: dez fases procedurais com Panto na quinta e Baltazar na décima'
          git push origin HEAD:feat/shuffle-procedural-10
