name: Check wildlife in browser
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the fox and owl encounters
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/wildlife-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          python tests/browser/wildlife_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildlife-browser-review
          path: .cache/wildlife-review/
          retention-days: 7
