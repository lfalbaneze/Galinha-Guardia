name: Sprite contact review
on:
  push:
    branches: [fix/single-grounded-shadow]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Bake the installed art without regenerating sprites
        run: node scripts/build-pixellab-art.cjs
      - name: Check all grounded frames and shadow regressions
        run: |
          npm run typecheck
          npm run check:generated
          node --test tests/single-contact-shadow.test.cjs tests/sprite-foot-grounding.test.cjs tests/ground-shadows.test.cjs tests/sunlight.test.cjs tests/stealth-lagoon.test.cjs tests/hay-hiding-art.test.cjs tests/swimming.test.cjs
      - name: Commit the verified generated data on this review branch
        run: |
          git add systems/pixellab-art-data.js index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: inclui apoio das patas na versão do Git e atualiza cache'
            git push origin HEAD:fix/single-grounded-shadow
          fi
      - run: npm run build
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play and inspect the packaged game in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/sprite-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          python tests/browser/lake_smoke.py
          python tests/browser/wildlife_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-contact-review
          path: |
            .cache/lake-review/
            .cache/wildlife-review/
          retention-days: 7
