name: Validate isolated Shuffle prototype
on:
  push:
    branches: [feat/shuffle-prototype]
    paths:
      - 'shuffle/**'
      - 'tests/shuffle-run.test.cjs'
      - 'tests/browser/shuffle_smoke.py'
      - '.github/workflows/prepare-shuffle-prototype.yml'
permissions:
  contents: write
jobs:
  prototype:
    if: github.repository == 'lfalbaneze/Galinha-Guardia' && github.ref == 'refs/heads/feat/shuffle-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shuffle-prototype
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Add opt-in menu entry and include prototype in distribution
        run: |
          test "$(git hash-object index.html)" = 9704276d3235930c63caa48a80faece8f6ead954
          test "$(git hash-object scripts/build.cjs)" = 887788b4b871e586371aeca9a01346117f82174d
          test "$(git hash-object shuffle/ui.js)" = a5238137317888103391a4e2ddcd169d0e5fc128
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');text=p.read_text(encoding='utf-8')
          anchor='<button id="newAdventureBtn" class="menu-primary" type="button">Nova aventura</button>'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\n              <a id="shuffleModeLink" href="./shuffle/index.html">Experimentar Shuffle <small>protótipo</small></a>')
          assert text.count('</head>')==1
          text=text.replace('</head>','  <link rel="stylesheet" href="./shuffle/menu-link.css?v=shuffle-1" />\n</head>')
          p.write_text(text,encoding='utf-8')
          p=Path('scripts/build.cjs');text=p.read_text(encoding='utf-8')
          anchor="'game.js','systems','assets']"
          assert text.count(anchor)==1
          text=text.replace(anchor,"'game.js','systems','assets','shuffle']")
          anchor="new vm.Script(fs.readFileSync(path.join(root,'game.js'),'utf8'),{filename:'game.js'});"
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+"\nfor(const name of ['engine.js','ui.js'])\n  new vm.Script(fs.readFileSync(path.join(root,'shuffle',name),'utf8'),{filename:'shuffle/'+name});")
          p.write_text(text,encoding='utf-8')
          p=Path('shuffle/ui.js');text=p.read_text(encoding='utf-8')
          anchor="'Carta necessária':p.cornCooldown>0?"
          assert text.count(anchor)==1
          text=text.replace(anchor,"'Carta necessária':p?.cornCooldown>0?")
          p.write_text(text,encoding='utf-8')
          p=Path('tests/browser/shuffle_smoke.py');text=p.read_text(encoding='utf-8')
          text=text.replace("page.wait_for_function('ShuffleDemo.ready')", "page.wait_for_function('window.ShuffleDemo && ShuffleDemo.ready')")
          anchor="    page.locator('#shuffleModeLink').click()\n"
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+"    page.wait_for_url('**/shuffle/index.html')\n")
          anchor='    # A valid boss-phase checkpoint is a fixture, not an injected victory.\n'
          assert text.count(anchor)==1
          regression='''    # Restoring a draft with corn has no player object until a card is chosen.
              context = browser.new_context(viewport={'width': 390, 'height': 844}, has_touch=True, is_mobile=True)
              page = context.new_page()
              draft_errors = []
              page.on('pageerror', lambda error: draft_errors.append(str(error)))
              page.goto(BASE + 'shuffle/', wait_until='networkidle')
              page.wait_for_function('window.ShuffleDemo && ShuffleDemo.ready')
              page.evaluate("""() => localStorage.setItem(ShuffleDemo.saveKey, JSON.stringify({version:1,seed:19,rng:19,stage:1,phase:'draft',skills:{corn:1},level:1,hp:3,choices:['boots','heart','call'],rerolls:1,elapsed:1}))""")
              page.reload(wait_until='networkidle')
              page.wait_for_function('window.ShuffleDemo && ShuffleDemo.ready')
              page.locator('#continueRun').click()
              assert page.locator('[data-skill]').count() == 3
              assert page.evaluate('ShuffleDemo.run.player === null')
              page.locator('[data-skill]').first.click()
              assert page.evaluate("ShuffleDemo.run.phase === 'playing' && ShuffleDemo.run.skills.corn === 1 && ShuffleDemo.run.level === 2")
              assert not draft_errors, draft_errors
              results.append({'restoredDraftWithCorn': True})
              context.close()
          '''
          import textwrap
          lines=regression.splitlines()
          regression=lines[0]+'\n'+textwrap.dedent('\n'.join(lines[1:])).rstrip()+'\n'
          # Keep this block at the same indentation as the boss fixture.
          regression=regression.splitlines()[0]+'\n'+'\n'.join('    '+line for line in regression.splitlines()[1:])+'\n'
          text=text.replace(anchor,regression+anchor)
          compile(text,str(p),'exec')
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          node --check shuffle/engine.js
          node --check shuffle/ui.js
      - run: npm ci
      - run: npm run typecheck && npm run check:generated
      - name: Validate progression, cards, combat, save isolation and classic menu
        run: node --test tests/shuffle-run.test.cjs tests/menu-scene.test.cjs tests/menu-play-hint.test.cjs
      - name: Build public files without committing unrelated cache rewrites
        run: |
          cp index.html "$RUNNER_TEMP/shuffle-index.html"
          npm run build
          cp "$RUNNER_TEMP/shuffle-index.html" index.html
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate packaged desktop, touch, boss counter and original menu entry
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/shuffle-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          python tests/browser/shuffle_smoke.py
      - name: Commit only validated prototype and integration files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-shuffle-prototype.yml
          git add shuffle index.html scripts/build.cjs tests/shuffle-run.test.cjs tests/browser/shuffle_smoke.py docs/shuffle-prototype.md
          git diff --cached --check
          git commit -m 'feat: publica protótipo Shuffle com fases, habilidades e Baltazar'
          git push origin HEAD:feat/shuffle-prototype
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shuffle-prototype-review
          path: .cache/shuffle-review/
          retention-days: 3
