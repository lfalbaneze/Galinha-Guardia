name: Refuge marker final review
on:
  push:
    branches: [review/refuge-marker-final]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:generated
      - run: node --test tests/natural-gait.test.cjs tests/player-ground-marker.test.cjs tests/gameplay-polish.test.cjs tests/progress.test.cjs tests/refuge.test.cjs tests/rescue-roster.test.cjs
